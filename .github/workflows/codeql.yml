name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '19 3 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: github/codeql-action/init@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths-ignore:
              - assets/vendor
              - maplibre
      - uses: github/codeql-action/analyze@f051dc808ef3645eb0d08647ec751634ec2304ac # v4
