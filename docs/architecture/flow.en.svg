<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img" aria-labelledby="title description" xml:lang="en"><title id="title">Personal website · From request to interaction</title><desc id="description">Starting with a visit, the diagram follows Earth rendering, process scenes and film loading, including graphics and media fallbacks. Grey boxes are processing steps, diamonds are decisions, green boxes are visible results, and amber boxes mark fallbacks or constraints.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="1550" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 393 V 417.5 H 600 V 442" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 528 V 575 H 220 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Earth</tspan></text><path d="M 600 528 V 575 H 600 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Process</tspan></text><path d="M 600 528 V 575 H 980 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Film</tspan></text><path d="M 220 708 V 743 H 220 V 778" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 220 882 V 929.5 H 220 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="234" y="917.5" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="234" dy="0">Yes</tspan></text><path d="M 220 882 V 929.5 H 600 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="917.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">No / load failure</tspan></text><path d="M 600 708 V 747.5 H 600 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 873 V 925 H 600 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="913" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">Unavailable</tspan></text><path d="M 980 708 V 747.5 H 980 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 873 V 925 H 980 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="994" y="913" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="994" dy="0">Failure / fallback</tspan></text><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="222" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Visit xxc2007.me</tspan></text><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="343.5" text-anchor="middle" font-size="14.1" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Choose Chinese / or English /en/</tspan><tspan x="600" dy="27">Separate HTML and SEO; shared CSS / JS</tspan></text><rect x="435" y="442" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="478.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Show text, navigation and project links</tspan><tspan x="600" dy="27">Load main.js for progressive enhancement</tspan></text><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="658.5" text-anchor="middle" font-size="15.76" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Enter the Earth section</tspan><tspan x="220" dy="27">Import scene.js and local Three.js</tspan></text><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="658.5" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Scroll near the process section</tspan><tspan x="600" dy="27">Import process-scene.js</tspan></text><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="658.5" text-anchor="middle" font-size="14.1" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Activate the film</tspan><tspan x="980" dy="27">Set video.src for the current language</tspan></text><path d="M 220 778 L 385 830 L 220 882 L 55 830 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="220" y="837" text-anchor="middle" font-size="17" font-weight="500" fill="#252a2e"><tspan x="220" dy="0">WebGL available?</tspan></text><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="823.5" text-anchor="middle" font-size="16.23" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Scroll progress drives the scenes</tspan><tspan x="600" dy="27">Use the page animation scheduler</tspan></text><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="823.5" text-anchor="middle" font-size="16.74" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Play inside the dialog</tspan><tspan x="980" dy="27">Pause and release media on close</tspan></text><rect x="55" y="977" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="220" y="1013.5" text-anchor="middle" font-size="16.74" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">Drag, use keys and tumble freely</tspan><tspan x="220" dy="27">Pause drawing when off screen</tspan></text><rect x="435" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="600" y="1013.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Retain fallback content if graphics fail</tspan><tspan x="600" dy="27">Text and project links remain readable</tspan></text><rect x="815" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="1013.5" text-anchor="middle" font-size="13.39" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">Offer a download link on media failure</tspan><tspan x="980" dy="27">Use the film link without dialog support</tspan></text><rect x="435" y="1147" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="600" y="1183.5" text-anchor="middle" font-size="13.74" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Respect reduced-motion preferences</tspan><tspan x="600" dy="27">Reduce animation; retain content access</tspan></text><rect x="435" y="1307" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="1343.5" text-anchor="middle" font-size="14.88" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">Project links open separate websites</tspan><tspan x="600" dy="27">/nc15/ memorial · /geohot/ geography</tspan></text><text x="600" y="1126" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">A preference respected across the interaction branches</tspan></text><text x="600" y="1286" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">Ordinary links lead to the projects; each has its own application and release boundary</tspan></text><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">Personal website · From request to interaction</tspan></text><text x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">Static pages, enhanced on demand. Follow each branch through a browsing action.</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">Process</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">Decision</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">Visible result</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">Guard / fallback</tspan></text><text x="600" y="1483" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">Logical flow based on repository source. Each website has its own release boundary.</tspan></text><text x="600" y="1515" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">Documentation illustration · 22 October 2026 · SVG, editable text and paths</tspan></text></g></svg>
