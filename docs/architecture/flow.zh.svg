ze="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">先呈现正文、导航与作品入口</tspan><tspan x="600" dy="27">浏览器加载 main.js，渐进增强</tspan></text></g><g data-node="earth" data-kind="process" data-cx="220" data-cy="665" data-half-height="43"><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="earth" x="220" y="656.94" text-anchor="middle" font-size="17" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">进入首屏地球</tspan><tspan x="220" dy="27">动态导入 scene.js 与本地 Three.js</tspan></text></g><g data-node="process" data-kind="process" data-cx="600" data-cy="665" data-half-height="43"><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="process" x="600" y="657.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">滚动接近制作过程</tspan><tspan x="600" dy="27">动态导入 process-scene.js</tspan></text></g><g data-node="film" data-kind="process" data-cx="980" data-cy="665" data-half-height="43"><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="film" x="980" y="657.26" text-anchor="middle" font-size="18" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">点击宣传片</tspan><tspan x="980" dy="27">设置 video.src，请求当前语言影片</tspan></text></g><g data-node="gpu" data-kind="decision" data-cx="220" data-cy="830" data-half-height="52"><path d="M 220 778 L 385 830 L 220 882 L 55 830 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text data-node-label="gpu" x="220" y="836.4" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="220" dy="0">WebGL 可用？</tspan></text></g><g data-node="scene" data-kind="process" data-cx="600" data-cy="830" data-half-height="43"><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="scene" x="600" y="822.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">滚动进度驱动分镜</tspan><tspan x="600" dy="27">共用页面动画调度</tspan></text></g><g data-node="play" data-kind="process" data-cx="980" data-cy="830" data-half-height="43"><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text data-node-label="play" x="980" y="822.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">对话框内播放</tspan><tspan x="980" dy="27">关闭后暂停并释放影片资源</tspan></text></g><g data-node="drag" data-kind="result" data-cx="220" data-cy="1020" data-half-height="43"><rect x="55" y="977" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text data-node-label="drag" x="220" y="1012.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">支持拖动、键盘与连续翻转</tspan><tspan x="220" dy="27">离屏时暂停绘制</tspan></text></g><g data-node="fallback" data-kind="guard" data-cx="600" data-cy="1020" data-half-height="43"><rect x="435" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="fallback" x="600" y="1012.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">图形不可用时保留后备内容</tspan><tspan x="600" dy="27">正文与作品链接仍可阅读</tspan></text></g><g data-node="mediafail" data-kind="guard" data-cx="980" data-cy="1020" data-half-height="43"><rect x="815" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="mediafail" x="980" y="1012.9" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">加载失败显示下载入口</tspan><tspan x="980" dy="27">不支持对话框时走原影片链接</tspan></text></g><g data-node="motion" data-kind="guard" data-cx="600" data-cy="1190" data-half-height="43"><rect x="435" y="1147" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text data-node-label="motion"