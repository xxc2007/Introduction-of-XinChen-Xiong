<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1550" viewBox="0 0 1200 1550" role="img" aria-labelledby="title description" xml:lang="zh"><title id="title">个人展示网站 · 从访问到交互</title><desc id="description">从一次访问开始，图中分别展开地球、制作分镜和影片的加载路径，以及图形或媒体不可用时的处理。灰色表示处理步骤，菱形表示判断，绿色表示可见结果，橙色表示后备路径或约束。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 L 2 3.5 Z" fill="#4e585f"/></marker></defs><rect width="1200" height="1550" fill="#ffffff"/><g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><path d="M 600 258 V 282.5 H 600 V 307" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 393 V 417.5 H 600 V 442" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 528 V 575 H 220 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="220" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">地球</tspan></text><path d="M 600 528 V 575 H 600 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="600" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">制作过程</tspan></text><path d="M 600 528 V 575 H 980 V 622" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="980" y="563" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">宣传片</tspan></text><path d="M 220 708 V 743 H 220 V 778" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 220 882 V 929.5 H 220 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="234" y="917.5" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="234" dy="0">是</tspan></text><path d="M 220 882 V 929.5 H 600 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="410" y="917.5" text-anchor="middle" font-size="16" font-weight="400" fill="#252a2e"><tspan x="410" dy="0">否 / 加载失败</tspan></text><path d="M 600 708 V 747.5 H 600 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 600 873 V 925 H 600 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="614" y="913" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="614" dy="0">不可用</tspan></text><path d="M 980 708 V 747.5 H 980 V 787" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 980 873 V 925 H 980 V 977" fill="none" stroke="#4e585f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="994" y="913" text-anchor="start" font-size="16" font-weight="400" fill="#252a2e"><tspan x="994" dy="0">失败 / 后备路径</tspan></text><circle cx="600" cy="146" r="7" fill="#252a2e"/><path d="M 600 153 V 172" stroke="#4e585f" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="435" y="172" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="222" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">访问 xxc2007.me</tspan></text><rect x="435" y="307" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="343.5" text-anchor="middle" font-size="18.03" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">选择中文 / 或英文 /en/</tspan><tspan x="600" dy="27">独立 HTML 与 SEO，共享 CSS / JS</tspan></text><rect x="435" y="442" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="478.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">先呈现正文、导航与作品入口</tspan><tspan x="600" dy="27">浏览器加载 main.js，渐进增强</tspan></text><rect x="55" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="220" y="658.5" text-anchor="middle" font-size="17.01" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">进入首屏地球</tspan><tspan x="220" dy="27">动态导入 scene.js 与本地 Three.js</tspan></text><rect x="435" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="658.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">滚动接近制作过程</tspan><tspan x="600" dy="27">动态导入 process-scene.js</tspan></text><rect x="815" y="622" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="658.5" text-anchor="middle" font-size="18.07" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">点击宣传片</tspan><tspan x="980" dy="27">设置 video.src，请求当前语言影片</tspan></text><path d="M 220 778 L 385 830 L 220 882 L 55 830 Z" fill="#ffffff" stroke="#68737b" stroke-width="1.7"/><text x="220" y="837" text-anchor="middle" font-size="20" font-weight="500" fill="#252a2e"><tspan x="220" dy="0">WebGL 可用？</tspan></text><rect x="435" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="600" y="823.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">滚动进度驱动分镜</tspan><tspan x="600" dy="27">共用页面动画调度</tspan></text><rect x="815" y="787" width="330" height="86" rx="7" fill="#f4f5f6" stroke="#899198" stroke-width="1.5"/><text x="980" y="823.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">对话框内播放</tspan><tspan x="980" dy="27">关闭后暂停并释放影片资源</tspan></text><rect x="55" y="977" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="220" y="1013.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="220" dy="0">支持拖动、键盘与连续翻转</tspan><tspan x="220" dy="27">离屏时暂停绘制</tspan></text><rect x="435" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="600" y="1013.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">图形不可用时保留后备内容</tspan><tspan x="600" dy="27">正文与作品链接仍可阅读</tspan></text><rect x="815" y="977" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="980" y="1013.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="980" dy="0">加载失败显示下载入口</tspan><tspan x="980" dy="27">不支持对话框时走原影片链接</tspan></text><rect x="435" y="1147" width="330" height="86" rx="7" fill="#fff5e9" stroke="#aa681f" stroke-width="2"/><text x="600" y="1183.5" text-anchor="middle" font-size="20" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">系统要求减少动态效果</tspan><tspan x="600" dy="27">交互按偏好降级，保留内容入口</tspan></text><rect x="435" y="1307" width="330" height="86" rx="7" fill="#edf6ee" stroke="#267349" stroke-width="2"/><text x="600" y="1343.5" text-anchor="middle" font-size="17.01" font-weight="400" fill="#252a2e"><tspan x="600" dy="0">从作品链接进入独立站点</tspan><tspan x="600" dy="27">/nc15/ 纪念册 · /geohot/ 地理热点</tspan></text><text x="600" y="1126" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">三条交互分支共同遵循的浏览偏好</tspan></text><text x="600" y="1286" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">作品入口是普通链接；本站不代理两个项目的业务逻辑</tspan></text><text x="600" y="45" text-anchor="middle" font-size="30" font-weight="600" fill="#252a2e"><tspan x="600" dy="0">个人展示网站 · 从访问到交互</tspan></text><text x="600" y="82" text-anchor="middle" font-size="18" font-weight="400" fill="#59646c"><tspan x="600" dy="0">静态页面为基础，按需增强；每条分支对应一次真实的浏览行为。</tspan></text><rect x="177" y="103" width="26" height="21" rx="3" fill="#f4f5f6" stroke="#899198"/><text x="213" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="213" dy="0">处理步骤</tspan></text><path d="M 435 102 l 13 11 l -13 11 l -13 -11 Z" fill="white" stroke="#899198"/><text x="458" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="458" dy="0">条件判断</tspan></text><rect x="667" y="103" width="26" height="21" rx="3" fill="#edf6ee" stroke="#267349"/><text x="703" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="703" dy="0">可见结果</tspan></text><rect x="912" y="103" width="26" height="21" rx="3" fill="#fff5e9" stroke="#aa681f"/><text x="948" y="119" text-anchor="start" font-size="16" font-weight="400" fill="#59646c"><tspan x="948" dy="0">约束 / 后备路径</tspan></text><text x="600" y="1483" text-anchor="middle" font-size="16" font-weight="400" fill="#626c74"><tspan x="600" dy="0">依据仓库源码绘制的逻辑流程；三个网站各有独立发布边界。</tspan></text><text x="600" y="1515" text-anchor="middle" font-size="15" font-weight="400" fill="#78838b"><tspan x="600" dy="0">文档示意图 · 2026 年 10 月 22 日 · SVG 文字与路径可编辑</tspan></text></g></svg>
