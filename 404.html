<!DOCTYPE html>
<!-- class="no-js" 在这页是**真话**：这一页不挂任何脚本，main.js 那句
     root.classList.replace('no-js','js') 永远不会执行，所以降级规则必须在这里生效。
     .reveal 的静止态是 opacity:0，全靠 html.no-js 把它抬回来——
     漏写这个类，将来任何人在这页加一个 .reveal 元素都会得到一个永久隐形的元素。 -->

<style>
/* 这一页零脚本：没有动效、没有交互，静态就能读完。
   下面这段只服务 404 独有的两个类，位置放在两份外链之前——
   style.css 加载成功时它说了算，加载失败（或字体切片没下来）时，
   衬线与颜色都退到系统字族和硬编码的纸墨值，页面照样站得住。 */
.nf-note{max-width:46em;margin-bottom:clamp(26px,3.4vw,40px)}
.nf-links{list-style:none;max-width:46em;margin-top:clamp(8px,1.4vw,16px);
  border-top:1px solid var(--line,#E4DFD3)}
.nf-links li{border-bottom:1px solid var(--line,#E4DFD3)}
.nf-links a{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 14px;
  padding:15px 2px;text-decoration:none;
}
.nf-links .zh{
  font-family:var(--serif,Georgia,"Times New Roman","Songti SC","STSong","Noto Serif CJK SC","SimSun",serif);
  font-size:clamp(18px,1vw + 14px,22px);font-weight:700;letter-spacing:.03em;
  color:var(--ink,#1F1E1D);
}
.nf-links .en{font-size:14px;letter-spacing:.02em;color:var(--muted,#6E6A5E)}
.nf-links a:hover .zh,.nf-links a:focus-visible .zh{color:var(--terra-ink,#A8492A)}
@media (max-width:420px){.nf-links a{gap:2px 10px;padding:13px 2px}}
</style>
<!-- 这一页是全仓唯一**不许用相对路径**的文件：nginx 用 error_page 把它内部重写到任意不存在的地址上，
     访客真正请求的是 /foo/bar 这种带目录的 URL，相对 ./assets/... 会被解析成 /foo/assets/... 而 404——
     于是错误页丢掉样式、四个出口里两个点不动。所以这里一律写根绝对路径。 -->
<link rel="stylesheet" href="/assets/fonts/noto-serif-sc/wght.css?v=4019bf">
<link rel="stylesheet" href="/assets/css/style.css?v=4019bf">
</head>
<body>
